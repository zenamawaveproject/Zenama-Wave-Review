<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pelanggan - Wave</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Login Dashboard</h1>
        <p class="text-xs text-center text-gray-500 mb-6">Masukkan ID Seri Kartu dan Password kamu</p>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">ID SERI KARTU</label>
                <input type="text" id="idSeri" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase" placeholder="Contoh: ZENWAVE1" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">PASSWORD</label>
                <input type="password" id="password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md">
                Masuk ke Dashboard
            </button>
        </form>

        <div id="statusMsg" class="mt-4 p-3 rounded-lg hidden text-xs font-semibold text-center"></div>
        
        <p class="text-xs text-center text-gray-500 mt-6">
            Kartu belum diaktivasi? <a href="/index.html" class="text-blue-600 font-semibold underline">Aktivasi di sini</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const idSeri = document.getElementById('idSeri').value.trim();
            const password = document.getElementById('password').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-yellow-100 text-yellow-800 block";
            statusMsg.innerText = "Verifikasi akun...";

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idSeri, password })
                });

                const result = await response.json();

                if (result.success) {
                    statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-green-100 text-green-800 block";
                    statusMsg.innerText = "Login Berhasil! Mengalihkan...";

                    localStorage.setItem('wave_card_id', idSeri);
                    localStorage.setItem('wave_auth_token', result.token);

                    setTimeout(() => {
                        window.location.href = `/dashboard.html?id=${idSeri}`;
                    }, 1000);
                } else {
                    statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-red-100 text-red-800 block";
                    statusMsg.innerText = result.message;
                }
            } catch (err) {
                statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-red-100 text-red-800 block";
                statusMsg.innerText = "Gagal terhubung ke server.";
            }
        });
    </script>
</body>
</html>
