<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kartu - Wave</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">

    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow">
        <div class="flex items-center justify-between border-b pb-4 mb-6">
            <h1 class="text-xl font-bold text-gray-800">Dashboard Kartu</h1>
            <span class="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-bold">AKTIF</span>
        </div>

        <div class="space-y-4">
            <div>
                <p class="text-xs text-gray-500">ID SERI KARTU</p>
                <p id="dashCardId" class="text-lg font-bold text-gray-800">-</p>
            </div>
            
            <div class="p-4 bg-gray-100 rounded-lg">
                <p class="text-sm font-semibold mb-1">Link Review Google Anda:</p>
                <p id="reviewLink" class="text-xs text-blue-600 break-all">Belum disetting</p>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id') || localStorage.getItem('wave_card_id');

        if (!cardId) {
            window.location.href = '/index.html';
        } else {
            document.getElementById('dashCardId').innerText = cardId;
        }
    </script>
</body>
</html>
