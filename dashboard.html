<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kartu - Wave</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4 flex justify-center items-center">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-lg">
        <div class="flex items-center justify-between border-b pb-4 mb-6">
            <div>
                <h1 class="text-xl font-bold text-gray-800">Dashboard Wave</h1>
                <p class="text-xs text-gray-500">Kelola kartu Google Review Anda</p>
            </div>
            <span class="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-bold">AKTIF</span>
        </div>

        <div class="space-y-4">
            <!-- Info ID Seri -->
            <div class="bg-blue-50 p-3 rounded-lg border border-blue-100 flex justify-between items-center">
                <span class="text-xs font-semibold text-blue-600">ID SERI KARTU:</span>
                <span id="dashCardId" class="text-base font-bold text-blue-900 tracking-wider">Memuat...</span>
            </div>

            <!-- Form Set/Edit Link Google Review -->
            <form id="saveLinkForm" class="space-y-3 pt-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">LINK GOOGLE REVIEW BISNIS</label>
                    <input type="url" id="reviewUrl" class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://g.page/r/xxxxx/review" required>
                    <p class="text-[10px] text-gray-400 mt-1">*Masukkan link tujuan saat kartu ini di-tap atau di-scan pelanggan.</p>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow">
                    Simpan Link Review
                </button>
            </form>

            <div id="dashMsg" class="p-3 rounded-lg hidden text-xs font-semibold text-center"></div>

            <div class="pt-4 border-t flex justify-between items-center">
                <button id="logoutBtn" class="text-xs text-red-500 font-semibold hover:underline">Keluar (Logout)</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id') || localStorage.getItem('wave_card_id');
        const dashMsg = document.getElementById('dashMsg');

        // Proteksi: Jika tidak ada ID Seri, lempar ke halaman login
        if (!cardId) {
            window.location.href = '/login.html';
        } else {
            document.getElementById('dashCardId').innerText = cardId;
            loadCardData();
        }

        // 1. Ambil data link dari Cloudflare KV via API
        async function loadCardData() {
            try {
                const res = await fetch(`/api/dashboard?id=${cardId}`);
                const data = await res.json();

                if (data.success && data.reviewUrl) {
                    document.getElementById('reviewUrl').value = data.reviewUrl;
                }
            } catch (err) {
                console.error("Gagal mengambil data:", err);
            }
        }

        // 2. Simpan Link Google Review baru
        document.getElementById('saveLinkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const reviewUrl = document.getElementById('reviewUrl').value.trim();

            dashMsg.className = "p-3 rounded-lg text-xs font-semibold text-center bg-yellow-100 text-yellow-800 block";
            dashMsg.innerText = "Menyimpan link baru...";

            try {
                const res = await fetch('/api/dashboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idSeri: cardId, reviewUrl })
                });

                const result = await res.json();

                if (result.success) {
                    dashMsg.className = "p-3 rounded-lg text-xs font-semibold text-center bg-green-100 text-green-800 block";
                    dashMsg.innerText = result.message;
                } else {
                    dashMsg.className = "p-3 rounded-lg text-xs font-semibold text-center bg-red-100 text-red-800 block";
                    dashMsg.innerText = result.message;
                }
            } catch (err) {
                dashMsg.className = "p-3 rounded-lg text-xs font-semibold text-center bg-red-100 text-red-800 block";
                dashMsg.innerText = "Gagal menyimpan link.";
            }
        });

        // 3. Fitur Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('wave_card_id');
            localStorage.removeItem('wave_auth_token');
            window.location.href = '/login.html';
        });
    </script>
</body>
</html>
