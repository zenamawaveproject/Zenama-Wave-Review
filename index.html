<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivasi Kartu Google Review - Wave</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center">
        <!-- Logo & Branding Google Review -->
        <div class="flex justify-center items-center gap-2 mb-2">
            <span class="text-2xl font-bold text-blue-500">G</span>
            <span class="text-2xl font-bold text-red-500">o</span>
            <span class="text-2xl font-bold text-yellow-500">o</span>
            <span class="text-2xl font-bold text-blue-500">g</span>
            <span class="text-2xl font-bold text-green-500">l</span>
            <span class="text-2xl font-bold text-red-500">e</span>
            <span class="text-xl font-semibold text-gray-600">Review</span>
        </div>
        <p class="text-xs text-gray-500 mb-6">Aktivasi Smart NFC Card milikmu</p>

        <!-- Display ID Seri dari URL -->
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-6">
            <span class="text-xs text-blue-600 block font-medium">ID SERI KARTU:</span>
            <span id="displayId" class="text-lg font-bold text-blue-800 tracking-wider">Mengecek Kartu...</span>
        </div>

        <!-- Form Aktivasi -->
        <form id="activationForm" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">PASSWORD KARTU</label>
                <input type="password" id="password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md">
                Aktivasi & Masuk Dashboard
            </button>
        </form>

        <div id="statusMsg" class="mt-4 p-3 rounded-lg hidden text-xs font-semibold"></div>
    </div>

    <script>
        // 1. Ambil Parameter ?id=... dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');
        const displayIdEl = document.getElementById('displayId');

        if (cardId) {
            displayIdEl.innerText = cardId;
        } else {
            displayIdEl.innerText = "ID Tidak Ditemukan!";
            displayIdEl.classList.add('text-red-600');
        }

        // 2. Submit Form Aktivasi
        document.getElementById('activationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!cardId) {
                alert("ID Seri Kartu tidak valid atau tidak ditemukan di URL!");
                return;
            }

            const password = document.getElementById('password').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold bg-yellow-100 text-yellow-800 block";
            statusMsg.innerText = "Mengirim data aktivasi...";

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idSeri: cardId, password })
                });

                const result = await response.json();

                if (result.success) {
                    statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold bg-green-100 text-green-800 block";
                    statusMsg.innerText = "Aktivasi Berhasil! Mengalihkan ke dashboard...";
                    
                    // Simpan sesi login & redirect ke Dashboard
                    localStorage.setItem('wave_card_id', cardId);
                    setTimeout(() => {
                        window.location.href = `/dashboard.html?id=${cardId}`;
                    }, 1200);

                } else {
                    statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold bg-red-100 text-red-800 block";
                    statusMsg.innerText = result.message;
                }
            } catch (err) {
                statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold bg-red-100 text-red-800 block";
                statusMsg.innerText = "Terjadi kesalahan koneksi.";
            }
        });
    </script>
</body>
</html>
