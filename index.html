<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivasi Kartu - Wave</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
        <!-- Header Branding Google Review -->
        <div class="flex justify-center items-center gap-1 mb-2 text-2xl font-bold">
            <span class="text-blue-500">G</span><span class="text-red-500">o</span><span class="text-yellow-500">o</span><span class="text-blue-500">g</span><span class="text-green-500">l</span><span class="text-red-500">e</span>
            <span class="text-gray-600 ml-1 text-xl">Review</span>
        </div>
        <p class="text-xs text-center text-gray-500 mb-6">Aktivasi Smart Card milikmu</p>

        <!-- ID SERI KARTU -->
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-6 text-center">
            <span class="text-xs text-blue-600 block font-medium">ID SERI KARTU:</span>
            <span id="displayId" class="text-lg font-bold text-blue-800 tracking-wider">Mengecek ID...</span>
        </div>

        <!-- Form Aktivasi Lengkap -->
        <form id="activationForm" class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">8 DIGIT PIN DEFAULT (DARI KARTU/KEMASAN)</label>
                <input type="text" id="pin" maxlength="8" class="w-full p-3 border border-gray-300 rounded-lg font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none tracking-widest text-center text-lg font-bold" placeholder="12345678" required>
            </div>

            <hr class="my-4 border-gray-200">

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">NAMA LENGKAP / NAMA USAMA</label>
                <input type="text" id="namaPemilik" class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Contoh: Kopi Wave" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">NO. WHATSAPP</label>
                <input type="tel" id="noHp" class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="08123456789" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">BUAT PASSWORD BARU (UNTUK LOGIN)</label>
                <input type="password" id="password" class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Password rahasia Anda" required>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">LINK GOOGLE REVIEW BISNIS</label>
                <input type="url" id="reviewUrl" class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://g.page/r/xxxx/review" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md mt-4">
                Aktivasi & Masuk Dashboard
            </button>
        </form>

        <div id="statusMsg" class="mt-4 p-3 rounded-lg hidden text-xs font-semibold text-center"></div>

        <p class="text-xs text-center text-gray-500 mt-6">
            Kartu sudah pernah diaktivasi? <a href="/login.html" class="text-blue-600 font-semibold underline">Login di sini</a>
        </p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');
        const displayIdEl = document.getElementById('displayId');

        if (cardId) {
            displayIdEl.innerText = cardId.toUpperCase();
        } else {
            displayIdEl.innerText = "ID TIDAK DITEMUKAN!";
            displayIdEl.classList.add('text-red-600');
        }

        document.getElementById('activationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!cardId) {
                alert("ID Seri Kartu tidak ditemukan pada link URL!");
                return;
            }

            const pin = document.getElementById('pin').value.trim();
            const namaPemilik = document.getElementById('namaPemilik').value.trim();
            const noHp = document.getElementById('noHp').value.trim();
            const password = document.getElementById('password').value.trim();
            const reviewUrl = document.getElementById('reviewUrl').value.trim();
            const statusMsg = document.getElementById('statusMsg');

            statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-yellow-100 text-yellow-800 block";
            statusMsg.innerText = "Memverifikasi PIN & Mengaktifkan Kartu...";

            try {
                const response = await fetch('/api/activate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idSeri: cardId.toUpperCase(), pin, namaPemilik, noHp, password, reviewUrl })
                });

                const result = await response.json();

                if (result.success) {
                    statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-green-100 text-green-800 block";
                    statusMsg.innerText = "Aktivasi Berhasil! Mengalihkan ke Dashboard...";

                    localStorage.setItem('wave_card_id', cardId.toUpperCase());
                    setTimeout(() => {
                        window.location.href = `/dashboard.html?id=${cardId.toUpperCase()}`;
                    }, 1200);
                } else {
                    statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-red-100 text-red-800 block";
                    statusMsg.innerText = result.message;
                }
            } catch (err) {
                statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-red-100 text-red-800 block";
                statusMsg.innerText = "Terjadi kesalahan koneksi server.";
            }
        });
    </script>
</body>
</html>
