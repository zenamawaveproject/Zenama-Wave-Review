<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Generate Kartu Wave</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- MODAL LOGIN ADMIN -->
    <div id="adminLoginModal" class="bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-xl font-extrabold text-blue-400">🔒 Admin Gate</h1>
            <p class="text-xs text-slate-400 mt-1">Masukkan Autentikasi Admin Wave</p>
        </div>

        <form id="adminLoginForm" class="space-y-3">
            <div>
                <label class="block text-[10px] font-semibold text-slate-400 mb-1">USERNAME ADMIN</label>
                <input type="text" id="adminUsername" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white text-xs focus:outline-none focus:border-blue-500" placeholder="Username" required>
            </div>
            <div>
                <label class="block text-[10px] font-semibold text-slate-400 mb-1">PASSWORD ADMIN</label>
                <input type="password" id="adminPassword" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white text-xs focus:outline-none focus:border-blue-500" placeholder="Password" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-lg transition text-xs shadow-lg mt-2">
                Masuk Ke Panel Admin
            </button>
        </form>
        <div id="loginMsg" class="mt-4 p-2.5 rounded-lg hidden text-xs font-semibold text-center"></div>
    </div>

    <!-- PANEL GENERATE (Hanya tampil jika sudah login) -->
    <div id="generatorPanel" class="hidden bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <div class="flex justify-between items-center mb-6 pb-3 border-b border-slate-700">
            <div>
                <h1 class="text-lg font-bold text-blue-400">Admin Panel Wave</h1>
                <p class="text-[10px] text-slate-400">Generate ID Seri & PIN Otomatis untuk Cetak Kartu</p>
            </div>
            <button id="btnLogoutAdmin" class="text-[10px] bg-red-500/10 text-red-400 hover:bg-red-500/20 px-2.5 py-1 rounded border border-red-500/30">
                Logout
            </button>
        </div>

        <form id="generateForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">ID SERI KARTU (8 KARAKTER)</label>
                <input type="text" id="idSeri" class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-white font-mono uppercase font-bold tracking-wider" readonly required placeholder="Klik Generate">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">PIN DEFAULT (8 DIGIT)</label>
                <input type="text" id="pin" class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-white font-mono font-bold tracking-wider" readonly required placeholder="Klik Generate">
            </div>

            <button type="button" id="btnRandom" class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-500 text-sm font-semibold py-2 rounded-lg transition">
                🎲 Acak ID & PIN Baru
            </button>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition shadow-lg mt-2 text-xs">
                Simpan ke Database KV
            </button>
        </form>

        <!-- OUTPUT LINK & KODE QR SIAP CETAK -->
        <div id="resultBox" class="mt-6 space-y-4 hidden bg-slate-900/80 p-4 rounded-xl border border-slate-700">
            <span class="text-[11px] font-bold text-emerald-400 block border-b border-slate-800 pb-2">✅ DATA & QR CODE BERHASIL DISIMPAN KE KV</span>
            
            <!-- TAMPILAN GAMBAR QR CODE & BUTTON DOWNLOAD -->
            <div class="flex flex-col items-center justify-center p-3 bg-white rounded-lg border border-slate-700">
                <img id="qrImage" src="" alt="QR Code" class="w-36 h-36 border border-slate-200 p-1 bg-white rounded">
                <button type="button" id="btnDownloadQr" onclick="downloadAdminQR()" class="mt-3 text-[11px] bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold transition shadow-md flex items-center space-x-1.5 cursor-pointer">
                    <span>⬇️ Download QR Code (.png)</span>
                </button>
            </div>

            <div>
                <span class="text-[10px] text-slate-500 block">LINK NFC (TAP):</span>
                <input type="text" id="linkTap" class="w-full bg-slate-800 border border-slate-700 p-2 rounded text-xs text-slate-300 font-mono" readonly>
            </div>
            <div>
                <span class="text-[10px] text-slate-500 block">LINK QR CODE:</span>
                <input type="text" id="linkQr" class="w-full bg-slate-800 border border-slate-700 p-2 rounded text-xs text-slate-300 font-mono" readonly>
            </div>
        </div>

        <div id="statusMsg" class="mt-4 p-3 rounded-lg hidden text-xs font-semibold text-center"></div>
    </div>

    <script>
        const adminLoginModal = document.getElementById('adminLoginModal');
        const generatorPanel = document.getElementById('generatorPanel');
        const loginMsg = document.getElementById('loginMsg');

        let currentBase64Image = '';
        let currentFilename = '';

        // Check Sesi Admin
        if (sessionStorage.getItem('wave_admin_token')) {
            adminLoginModal.classList.add('hidden');
            generatorPanel.classList.remove('hidden');
            generateRandomData();
        }

        // Handle Login Admin
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value.trim();

            loginMsg.className = "mt-4 p-2.5 rounded-lg text-xs font-semibold text-center bg-yellow-600/20 text-yellow-400 border border-yellow-500/30 block";
            loginMsg.innerText = "Memverifikasi...";

            try {
                const response = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    sessionStorage.setItem('wave_admin_token', result.token);
                    adminLoginModal.classList.add('hidden');
                    generatorPanel.classList.remove('hidden');
                    generateRandomData();
                } else {
                    loginMsg.className = "mt-4 p-2.5 rounded-lg text-xs font-semibold text-center bg-red-600/20 text-red-400 border border-red-500/30 block";
                    loginMsg.innerText = result.message;
                }
            } catch (err) {
                loginMsg.className = "mt-4 p-2.5 rounded-lg text-xs font-semibold text-center bg-red-600/20 text-red-400 border border-red-500/30 block";
                loginMsg.innerText = "Gagal memverifikasi login.";
            }
        });

        // Logout
        document.getElementById('btnLogoutAdmin').addEventListener('click', () => {
            sessionStorage.removeItem('wave_admin_token');
            location.reload();
        });

        // Helper Random
        function makeId(length) {
            let result = '';
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        function makePin(length) {
            let result = '';
            const characters = '0123456789';
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        function generateRandomData() {
            document.getElementById('idSeri').value = makeId(8);
            document.getElementById('pin').value = makePin(8);
            document.getElementById('resultBox').classList.add('hidden');
            currentBase64Image = '';
            currentFilename = '';
        }

        document.getElementById('btnRandom').addEventListener('click', generateRandomData);

        // Submit Form Generate Ke KV (Backend otomatis meng-generate & menyimpan Base64 QR)
        document.getElementById('generateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const idSeri = document.getElementById('idSeri').value;
            const pin = document.getElementById('pin').value;
            const statusMsg = document.getElementById('statusMsg');
            const resultBox = document.getElementById('resultBox');

            statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-yellow-600 text-white block";
            statusMsg.innerText = "Generating QR Code & Menyimpan data ke Cloudflare KV...";

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idSeri, pin })
                });

                const result = await response.json();

                if (result.success) {
                    statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-green-600 text-white block";
                    statusMsg.innerText = result.message;

                    // 1. Tautan NFC (tap) dan QR Code (qr) menggunakan subdomain cards.zenamagroup.com
                    const urlTap = `https://cards.zenamagroup.com/?id=${idSeri}&src=tap`;
                    const urlQr = `https://cards.zenamagroup.com/?id=${idSeri}&src=qr`;

                    document.getElementById('linkTap').value = urlTap;
                    document.getElementById('linkQr').value = urlQr;

                    // 2. Tampilkan Gambar QR Code dari Base64 yang dikembalikan Backend (hasil simpan KV)
                    if (result.qr_code_base64) {
                        currentBase64Image = result.qr_code_base64;
                        currentFilename = `${idSeri}.png`;
                        document.getElementById('qrImage').src = result.qr_code_base64;
                    }

                    // 3. Tampilkan Box Hasil Cetak
                    resultBox.classList.remove('hidden');

                } else {
                    statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-red-600 text-white block";
                    statusMsg.innerText = result.message;
                }
            } catch (err) {
                statusMsg.className = "mt-4 p-3 rounded-lg text-xs font-semibold text-center bg-red-600 text-white block";
                statusMsg.innerText = "Gagal terhubung ke API Server.";
            }
        });

        // Fungsi Unduh Gambar QR langsung dari Base64
        function downloadAdminQR() {
            if (!currentBase64Image) return;
            const link = document.createElement('a');
            link.href = currentBase64Image;
            link.download = currentFilename || 'QR-Code.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
